<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14163A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Horários da escola</title>
<style>
  :root{
    --ink:#14163A;--on:#FFFFFF;--bus:#F2F3FA;--sky:#F2F3FA;--card:#FFFFFF;--bege:#E8EAF7;--line:#D9DCEF;--mute:#5A5E85;--now:#4338CA;
    --agora:#E6E4FB;--rojo:#C62828;--rojo-bg:#FFF1F0;--alerta-bg:#FDECEA;--alerta-tx:#8E1B1B;
    --titulo:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
    --texto:"DM Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  }
  :root[data-tema="escuro"]{
    --ink:#ECEBFF;--on:#0C0E24;--bus:#0C0E24;--sky:#0C0E24;--card:#161A3A;--bege:#1D2147;--line:#2B3066;--mute:#A3A8D6;--now:#9A93FF;
    --agora:#222759;--rojo:#EF5350;--rojo-bg:#2A1A24;--alerta-bg:#2E1A26;--alerta-tx:#FFB4C0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--texto);line-height:1.4}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--now);outline-offset:2px}
  h1,h2,h3,.hero-materia,.turma strong,.contador b,.aula time,.dias b{font-family:var(--titulo)}

  header{padding:20px 18px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
  header h1{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
  header p{margin:4px 0 0;font-weight:500;font-size:.9rem;color:var(--mute)}
  .botoes{display:flex;gap:8px;flex:none}
  .engrenagem{background:var(--card);border:1px solid var(--line);border-radius:14px;width:44px;height:44px;font-size:1.25rem;line-height:1;flex:none}

  main{max-width:640px;margin:0 auto;padding:12px 18px 48px}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grade.uma{grid-template-columns:1fr}

  .turma{position:relative;overflow:hidden;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 20px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
  .turma::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--line))}
  .turma strong{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
  .turma span{font-size:.88rem;color:var(--mute)}
  .turma.ativa{border-color:var(--c)}
  .turma.ativa span{color:var(--ink);font-weight:700}
  .turma:disabled{opacity:.6;cursor:not-allowed;border-style:dashed}
  .beta{align-self:flex-start;background:var(--rojo);color:#fff!important;font-weight:800;padding:3px 9px;border-radius:99px}
  .turma span.livro-aviso{color:var(--rojo);font-weight:800}

  .hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;border-radius:28px;padding:22px 22px 20px;background:var(--c,var(--ink));color:#fff;margin-bottom:16px}
  .hero::after{content:attr(data-letra);position:absolute;right:10px;top:-18px;font:800 9rem/1 var(--titulo);opacity:.13;pointer-events:none}
  .hero-rot{font-weight:700;font-size:.95rem;opacity:.92}
  .hero-materia{font-size:clamp(1.9rem,9vw,2.6rem);font-weight:800;line-height:1.02;letter-spacing:-.03em;max-width:88%}
  .hero-linha{font-weight:500;opacity:.95}
  .barra{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.3);margin:10px 0 2px;overflow:hidden}
  .barra i{display:block;height:100%;background:#fff;border-radius:99px}
  .hero-resto{font-weight:700;font-size:.95rem}

  .voltar{background:none;border:0;padding:6px 0;margin-bottom:8px;font-weight:700;text-decoration:underline}
  h2{margin:0 0 14px;font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  h3{margin:0 0 6px;font-size:1.1rem;font-weight:800;letter-spacing:-.01em}

  .dias{display:flex;gap:8px;margin-bottom:16px}
  .dias button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0 9px;background:var(--card);border:1px solid var(--line);border-radius:16px;font-weight:700;font-size:.85rem}
  .dias b{font-size:1.3rem;font-weight:800;line-height:1.1}
  .dias button[aria-pressed="true"]{background:var(--ink);color:var(--on);border-color:var(--ink)}
  .ponto{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--rojo)}

  .aulas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .aula{position:relative;overflow:hidden;display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 20px}
  .aula::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--now))}
  .aula time{font-weight:800;font-size:1.05rem;line-height:1.15}
  .aula time small{display:block;font-family:var(--texto);font-weight:500;color:var(--mute);font-size:.78rem}
  .aula .materia{font-size:1.05rem;font-weight:700;line-height:1.25}
  .aula .prof{display:block;font-size:.85rem;font-weight:500;color:var(--mute)}
  .aula.intervalo,.aula.livre{background:transparent;border-style:dashed;padding-top:8px;padding-bottom:8px}
  .aula.intervalo::before,.aula.livre::before{display:none}
  .aula.intervalo .materia,.aula.livre .materia{color:var(--mute);font-weight:500;font-size:.95rem}
  .aula.agora{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
  .aula.livro{background:var(--rojo-bg)}
  .lado{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .selo{background:var(--now);color:var(--on);font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .selo.vermelho{background:var(--rojo);color:#fff}
  .vazio{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--mute)}
  .alerta{background:var(--alerta-bg);border:1px solid var(--rojo);color:var(--alerta-tx);border-radius:16px;padding:12px 14px;font-weight:700;margin-bottom:14px}

  .topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .fixar{background:var(--card);border:1.5px solid var(--ink);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.85rem}
  .fixar[aria-pressed="true"]{background:var(--ink);color:var(--on)}
  .dica{margin:0 0 12px;color:var(--mute);font-size:.9rem;font-weight:500}

  .cfg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .cfg .dias{margin-bottom:0}
  .cfg .dias button{flex-direction:row;justify-content:center;font-size:.95rem;padding:10px 0}
  .opcao{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:700;border-top:1px solid var(--line)}
  .opcao input{width:22px;height:22px;accent-color:var(--now)}

  .rot{display:block;font-weight:700;margin-bottom:6px}
  .campo{display:block;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
  textarea.campo{resize:vertical}
  .botao{background:var(--ink);color:var(--on);border:0;border-radius:99px;padding:12px 22px;font-weight:800}
  .erro{color:var(--rojo);font-weight:700;margin:0 0 12px}

  .cfg.avisos-card{background:var(--ink);border-color:var(--ink);color:var(--on);border-radius:22px;padding:16px 18px}
  .cfg.avisos-card h3{color:var(--on)}
  .aviso{border-top:1px solid var(--line);padding:10px 0}
  .aviso:first-of-type{border-top:0;padding-top:4px}
  .aviso strong{display:block}
  .aviso p{margin:4px 0;white-space:pre-wrap}
  .aviso small{color:var(--mute);font-weight:500}
  .cfg.avisos-card .aviso{border-top-color:rgba(128,128,160,.35)}
  .cfg.avisos-card .aviso small{color:inherit;opacity:.72}
  #pushBtn{background:var(--ink);color:var(--on);width:100%;padding:12px;font-size:1rem;border-radius:99px;border-color:var(--ink)}

  .contador{background:var(--ink);color:var(--on);border-radius:26px;padding:22px;text-align:center;margin-bottom:12px}
  .contador b{display:block;font-size:3.6rem;line-height:1;font-weight:800;letter-spacing:-.04em}
  .contador span{font-weight:700}
  .mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mes strong{font-size:1.1rem;font-family:var(--titulo)}
  .mes button{background:var(--card);border:1px solid var(--line);border-radius:12px;width:42px;height:38px;font-weight:800}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:10px}
  .cal .sem{font-size:.8rem;color:var(--mute);font-weight:700}
  .cal button{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:700;padding:0}
  .cal .pag{border-color:var(--now);background:var(--agora)}
  .cal .hoje{outline:2px dashed var(--ink);outline-offset:1px}
  .cal .esc{background:var(--ink);color:var(--on);border-color:var(--ink)}
  .legenda{font-size:.85rem;color:var(--mute);font-weight:500;margin:0 0 14px}

  .ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
  .engrenagem{display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .engrenagem .ic{width:22px;height:22px}
  .voltar{display:inline-flex;align-items:center;gap:2px}
  .fixar{display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .mes button{display:inline-flex;align-items:center;justify-content:center;padding:0}
  .cfg .dias button{gap:8px}
  h3 .ic{margin-right:4px}
  .turma strong .ic{width:.85em;height:.85em;vertical-align:-.05em;color:#E0A100}
  .livro-aviso .ic,.alerta .ic{vertical-align:-.25em}

  .acc{padding:0;overflow:hidden}
  .acc-cab{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:14px;text-align:left}
  .acc-tit{font-family:var(--titulo);font-weight:800;font-size:1.1rem;letter-spacing:-.01em}
  .acc-resumo{margin-left:auto;color:var(--mute);font-size:.88rem;font-weight:500}
  .acc-cab .seta{width:1.3em;height:1.3em;transition:transform .3s ease}
  .acc.aberto .seta{transform:rotate(180deg)}
  .acc-corpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
  .acc.aberto .acc-corpo{grid-template-rows:1fr}
  .acc-int{overflow:hidden;min-height:0;padding:0 14px}
  .acc.aberto .acc-int{padding-bottom:14px}
  .acc-int .opcao:first-of-type{border-top:0}
  .temas{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:3px}
  .tema-op{display:flex;flex-direction:column;gap:8px;align-items:stretch;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;font-weight:700;text-align:left}
  .tema-op[aria-pressed="true"]{border-color:var(--now);box-shadow:0 0 0 2px var(--now)}
  .tema-prev{display:flex;align-items:flex-end;gap:5px;height:44px;border-radius:9px;padding:7px;border:1px solid rgba(128,128,160,.35)}
  .tema-prev i{display:block;height:100%;width:14px;border-radius:4px}
  .tema-prev i:first-child{height:70%}
  @media (prefers-reduced-motion:reduce){.acc-corpo,.acc-cab .seta{transition:none}}

  .evento{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .evento:first-of-type{border-top:0}
  .evento strong{display:block}
  .evento small{display:block;color:var(--mute);font-weight:500}
  .ev-data{flex:none;width:50px;height:54px;border-radius:12px;background:var(--bege);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--mute)}
  .ev-data b{font-family:var(--titulo);font-size:1.35rem;line-height:1;color:var(--ink)}
  .cardapio-dia{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .cardapio-dia:first-child{border-top:0}
  .cardapio-dia b{flex:none;width:36px}
  .acc-tit{white-space:nowrap}
  .acc-resumo{min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .aula.vaga{border-style:dashed}
  .aula.vaga .materia{opacity:.7}

  /* ---- tema Clássico: o formato antigo (verde, bordas grossas) ---- */
  :root[data-tema="classico"]{
    --ink:#1E3B2C;--on:#FFFFFF;--bus:#CFE8D5;--sky:#EEF5EF;--card:#FFFFFF;--bege:#E1F3E7;--line:#C9DECE;--mute:#53705E;--now:#2F8F5B;
    --agora:#E1F3E7;--rojo:#C62828;--rojo-bg:#FFF5F4;--alerta-bg:#FDECEA;--alerta-tx:#8E1B1B;
  }
  :root[data-tema="classico-escuro"]{
    --ink:#D6EBDD;--on:#10201A;--bus:#1B3326;--sky:#0F1A14;--card:#17261D;--bege:#1B3326;--line:#2C4636;--mute:#9DB8A7;--now:#3FAE75;
    --agora:#1C3A29;--rojo:#EF5350;--rojo-bg:#2A1A1A;--alerta-bg:#2E1A1A;--alerta-tx:#FFB4AB;
  }
  :root[data-tema^="classico"]{
    --titulo:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;
    --texto:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;
  }
  :root[data-tema^="classico"] header{background:var(--bus);border-bottom:6px solid var(--ink);max-width:none;margin:0;padding:22px 18px 18px;align-items:center}
  :root[data-tema^="classico"] header h1{font-size:1.7rem;letter-spacing:-.02em}
  :root[data-tema^="classico"] header p{color:var(--ink);font-weight:600}
  :root[data-tema^="classico"] .engrenagem{border:2px solid var(--ink);border-radius:50%;width:46px;height:46px}
  :root[data-tema^="classico"] .turma{border:2px solid var(--ink);border-radius:14px;padding:14px}
  :root[data-tema^="classico"] .turma.ativa{border-color:var(--now)}
  :root[data-tema^="classico"] .turma::before,:root[data-tema^="classico"] .aula::before{display:none}
  :root[data-tema^="classico"] .aula{border:2px solid var(--line);border-radius:14px;padding:12px 14px}
  :root[data-tema^="classico"] .aula.agora{border-color:var(--now);background:var(--agora);box-shadow:none}
  :root[data-tema^="classico"] .dias button{border:2px solid var(--ink);border-radius:10px}
  :root[data-tema^="classico"] .cfg{border:2px solid var(--line);border-radius:14px}
  :root[data-tema^="classico"] .cfg.avisos-card{border-color:var(--ink);border-radius:14px}
  :root[data-tema^="classico"] .hero{border-radius:14px;border:2px solid var(--ink)}
  :root[data-tema^="classico"] .contador{border-radius:14px}

  /* ---- animações calmas (só ao trocar de tela) ---- */
  @keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  #app[data-anim="1"] > *{animation:entra .45s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] > *:nth-child(2){animation-delay:0.090s}
  #app[data-anim="1"] > *:nth-child(3){animation-delay:0.135s}
  #app[data-anim="1"] > *:nth-child(4){animation-delay:0.180s}
  #app[data-anim="1"] > *:nth-child(5){animation-delay:0.225s}
  #app[data-anim="1"] > *:nth-child(6){animation-delay:0.270s}
  #app[data-anim="1"] > *:nth-child(7){animation-delay:0.315s}
  #app[data-anim="1"] > *:nth-child(8){animation-delay:0.360s}
  #app[data-anim="1"] > *:nth-child(9){animation-delay:0.405s}
  #app[data-anim="1"] .aulas > li:nth-child(1),#app[data-anim="1"] .grade > .turma:nth-child(1){animation:entra .4s 0.16s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(2),#app[data-anim="1"] .grade > .turma:nth-child(2){animation:entra .4s 0.20s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(3),#app[data-anim="1"] .grade > .turma:nth-child(3){animation:entra .4s 0.24s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(4),#app[data-anim="1"] .grade > .turma:nth-child(4){animation:entra .4s 0.28s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(5),#app[data-anim="1"] .grade > .turma:nth-child(5){animation:entra .4s 0.32s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(6),#app[data-anim="1"] .grade > .turma:nth-child(6){animation:entra .4s 0.36s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(7),#app[data-anim="1"] .grade > .turma:nth-child(7){animation:entra .4s 0.40s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(8),#app[data-anim="1"] .grade > .turma:nth-child(8){animation:entra .4s 0.44s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(9),#app[data-anim="1"] .grade > .turma:nth-child(9){animation:entra .4s 0.48s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(10),#app[data-anim="1"] .grade > .turma:nth-child(10){animation:entra .4s 0.52s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(11),#app[data-anim="1"] .grade > .turma:nth-child(11){animation:entra .4s 0.56s cubic-bezier(.2,.7,.2,1) both}
  #app[data-anim="1"] .aulas > li:nth-child(12),#app[data-anim="1"] .grade > .turma:nth-child(12){animation:entra .4s 0.60s cubic-bezier(.2,.7,.2,1) both}
  
  .barra i{transform-origin:left}
  #app[data-anim="1"] .barra i{animation:cresce .9s .25s cubic-bezier(.2,.7,.2,1) both}
  .turma,.fixar,.botao,.tema-op,.dias button,.engrenagem,.acc-cab{transition:transform .15s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease}
  .turma:active,.fixar:active,.botao:active,.tema-op:active,.dias button:active,.engrenagem:active{transform:scale(.97)}
  @media (hover:hover){.turma:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,22,58,.12)}}
  :root[data-mov="off"] *,:root[data-mov="off"] *::before,:root[data-mov="off"] *::after{animation:none!important;transition:none!important}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  /* ---- cardápio e trava de sala ---- */
  .refeicao{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:12px}
  .refeicao.prox{background:var(--agora)}
  .ref-hora{flex:none;width:50px;font-family:var(--titulo);font-weight:800;font-size:1.05rem}
  .refeicao strong{display:block}
  .refeicao div span{display:block;color:var(--mute);font-weight:500}
  .acc.interno{margin-top:8px;border-top:1px solid var(--line)}
  .acc.interno .acc-cab{padding:12px 2px}
  .acc.interno .acc-int{padding:0 2px}
  .cardapio-dia span{display:block}
  .cardapio-dia i{font-style:normal;color:var(--mute);font-weight:600}
  .trava .botao{margin-top:2px}

  /* ---- tela de carregamento ---- */
  #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(170deg,#12844b 0%,#075e36 100%);color:#fff;transition:opacity .5s ease,visibility .5s ease;animation:spSome 0s 7s forwards}
  #splash.sai{opacity:0;visibility:hidden}

const formatar = s => { const d = parseData(s); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`; };
const hoje0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };

async function api(caminho, opcoes){
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + caminho, Object.assign({}, opcoes, {
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" }
  }));
  const texto = await r.text();
  let dados = null;
  try { dados = texto ? JSON.parse(texto) : null; } catch(e) {}
  if(!r.ok) throw new Error((dados && dados.message) || "Erro de conexão");

}
async function postarAviso(args){

  });

  if(!r.ok) throw new Error((d && d.erro) || "Erro de conexão");
  return d;
}

function buscarSala(sala){
  const b = buscasSala[sala];

/* Mostra na hora o que já foi carregado antes e atualiza quando o servidor responder. */
const cacheBlocos = {};
function carregarBloco(id, chave, buscar, montar, vazio, erro){
  const el0 = document.getElementById(id);
  if(el0 && cacheBlocos[chave] !== undefined){ el0.innerHTML = cacheBlocos[chave]; ligarAcc(el0); ligarTrava(el0); }
  buscar().then(dados => {
    const html = montar(dados) || vazio || "";
    cacheBlocos[chave] = html;
    const el = document.getElementById(id);
    if(el){ el.innerHTML = html; ligarAcc(el); ligarTrava(el); }
  }).catch(err => {
    const custom = erro ? erro(err) : null;
    const el = document.getElementById(id);
    if(custom){ cacheBlocos[chave] = custom; if(el){ el.innerHTML = custom; ligarTrava(el); } return; }
    if(cacheBlocos[chave] !== undefined) return;
    if(el && vazio !== "") el.innerHTML = '<p class="erro">Não consegui carregar (' + esc(err.message) + ').</p>';
  });

function avisosAtivos(){

}
const precisaLivro = (a, turma) => {
  if(a.intervalo) return false;
  const at = avisosAtivos();
  return Object.entries(LIVROS).some(([n, ms]) => at.includes(n) && ms.includes(a.materia));

/* ---------- horários ---------- */
function agora(){
  const d = new Date();
  return { dia: CHAVE_DIA[d.getDay()], min: d.getHours()*60 + d.getMinutes() };
}
function diaInicial(){ const t = agora(); return NOME_DIA[t.dia] ? t.dia : "seg"; }
 
function aulasDoDia(turma, dia){
  const lista = (TURMAS[turma] || {})[dia];
  if(!lista) return [];
  let i = 0, n = 0;
  return PERIODOS.map(p => {
    if(p.intervalo) return { ini:p.ini, fim:p.fim, intervalo:true, materia:p.nome || "Intervalo", prof:"", n:0 };
    const item = lista[i++];
    n++;
    return { ini:p.ini, fim:p.fim, intervalo:false, n, materia: item ? item[0] : "Vago", prof: item ? item[1] : "", livre: !item };
  });
}
const estaAgora = (a, t) => minutos(a.ini) <= t.min && t.min < minutos(a.fim);
const aulaAgora = turma => { const t = agora(); return aulasDoDia(turma, t.dia).find(a => estaAgora(a, t)) || null; };
const livrosDoDia = (turma, dia) => [...new Set(aulasDoDia(turma, dia).filter(a => precisaLivro(a, turma)).map(a => a.materia))];
 
function abasDia(selecionado, temLivro){
  return DIAS.map(([k, r]) =>
    `<button data-dia="${k}" aria-pressed="${k === selecionado}"><span>${r}</span><b>${dataDia(k)}</b>${temLivro(k) ? '<i class="ponto" title="Tem aula que precisa de livro"></i>' : ""}</button>`
  ).join("");
}
 
/* ---------- cor de cada matéria ---------- */
const CORES = [
  [/matem/i, "#3558F5"], [/f[ií]sica$/i, "#0891B2"], [/^f[ií]sica/i, "#0891B2"], [/qu[ií]mica/i, "#7C3AED"], [/biologia/i, "#15803D"],
  [/portugu|leitura|reda/i, "#D9480F"], [/ingl|espanhol|aprofundamento/i, "#DB2777"],
  [/hist[oó]ria|geografia|sociologia|filosofia/i, "#A16207"],
  [/artes|educação física|esportes|ed\. física/i, "#E11D48"],
  [/banco de dados|arquitetura|intelig|rob[oó]tica|ágeis|mentoria|^curso$|financeira|empreend/i, "#0F766E"]
];
const corMateria = m => { for(const [re, c] of CORES) if(re.test(m)) return c; return "#64748B"; };
const maiuscula = t => t.charAt(0).toUpperCase() + t.slice(1);

/* número do dia de cada aba (semana atual; no fim de semana mostra a próxima) */
function dataCompleta(k){
  const d = hoje0(), dow = d.getDay();
  d.setDate(d.getDate() - ((dow + 6) % 7) + (dow === 0 || dow === 6 ? 7 : 0) + DIAS.findIndex(x => x[0] === k));

}

/* cartão grande "agora" da tela inicial */
function heroHtml(sala){
  if(!sala || !TURMAS[sala]) return "";
  const t = agora();
  const util = !!NOME_DIA[t.dia];
  const aulas = util ? aulasDoDia(sala, t.dia) : [];
  const atual = util ? aulas.find(a => estaAgora(a, t)) : null;
  let cor = "var(--ink)", rot, titulo, linha, rodape, pct = null;
  if(atual){
    const prox = aulas.find(a => !a.intervalo && minutos(a.ini) >= minutos(atual.fim));
    cor = atual.intervalo ? "#334155" : corMateria(atual.materia);
    rot = "Agora, " + sala;
    titulo = atual.materia;
    linha = (atual.prof ? atual.prof + " · " : "") + atual.ini + " às " + atual.fim;
    pct = Math.max(0, Math.min(100, (t.min - minutos(atual.ini)) / (minutos(atual.fim) - minutos(atual.ini)) * 100));
    rodape = "Faltam " + (minutos(atual.fim) - t.min) + " min" + (prox ? " · Depois: " + prox.materia + " às " + prox.ini : " · É a última aula do dia");
  } else {
    const prox = aulas.find(a => !a.intervalo && minutos(a.ini) > t.min);
    if(prox){
      cor = corMateria(prox.materia);
      rot = "Próxima aula, " + sala;
      titulo = prox.materia;
      linha = (prox.prof ? prox.prof + " · " : "") + prox.ini + " às " + prox.fim;
      rodape = "Começa em " + (minutos(prox.ini) - t.min) + " min";
    } else {
      const ordem = ["seg","ter","qua","qui","sex"];
      const i = ordem.indexOf(t.dia);
      const dia = (i >= 0 && i < 4) ? ordem[i + 1] : "seg";
      const primeira = aulasDoDia(sala, dia).find(a => !a.intervalo && !a.livre) || aulasDoDia(sala, dia).find(a => !a.intervalo);
      if(!primeira) return "";
      cor = corMateria(primeira.materia);
      rot = (util ? "Acabou por hoje, " : "Bom fim de semana, ") + sala;
      titulo = primeira.materia;
      linha = maiuscula(NOME_DIA[dia]) + " às " + primeira.ini + (primeira.prof ? " · " + primeira.prof : "");
      rodape = "Primeira aula de " + NOME_DIA[dia];
    }
  }
  const tam = titulo.length > 30 ? "1.45rem" : (titulo.length > 18 ? "1.9rem" : "");
  return `<button class="hero" data-hero="${esc(sala)}" data-letra="${esc(titulo.charAt(0).toUpperCase())}" style="--c:${cor}">
    <span class="hero-rot">${esc(rot)}</span>
    <strong class="hero-materia"${tam ? ` style="font-size:${tam}"` : ""}>${esc(titulo)}</strong>
    <span class="hero-linha">${esc(linha)}</span>
    ${pct !== null ? `<span class="barra"><i style="width:${pct.toFixed(0)}%"></i></span>` : ""}
    <span class="hero-resto">${esc(rodape)}</span></button>`;
}

function telaPerfil(){
  const salas = Object.keys(TURMAS).map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  const msgErro = erroPerfil ? `<p class="erro">${esc(erroPerfil)}</p>` : "";
  let corpo;
  if(modoPerfil === "aluno"){
    corpo = `
      <label class="rot" for="pNome">Seu nome</label>
      <input class="campo" id="pNome" type="text" maxlength="40" autocomplete="given-name">
      <label class="rot" for="pSala">Sua sala</label>

      <label class="rot" for="pSalaSenha">Senha da sala</label>
      <input class="campo" id="pSalaSenha" type="password" autocomplete="off">
      <p class="dica">A senha da sala é a que o seu professor passou. Ela libera os avisos e as provas da sua sala.</p>
      ${msgErro}
      <button class="botao" id="pEntrar">Entrar</button>`;
  } else if(modoPerfil === "professor"){
    corpo = `
      <label class="rot" for="pNome">Seu nome</label>
      <input class="campo" id="pNome" type="text" maxlength="40" autocomplete="given-name">
      <label class="rot" for="pSenha">Senha de professor</label>
      <input class="campo" id="pSenha" type="password" autocomplete="off">
      ${msgErro}
      <button class="botao" id="pEntrar">Entrar</button>`;
  } else if(modoPerfil === "diretor"){
    corpo = `
      <label class="rot" for="pNome">Seu nome</label>
      <input class="campo" id="pNome" type="text" maxlength="40" autocomplete="given-name">
      <label class="rot" for="pSenha">Senha da direção</label>
      <input class="campo" id="pSenha" type="password" autocomplete="off">
      ${msgErro}
      <button class="botao" id="pEntrar">Entrar</button>`;
  } else {
    corpo = `
      <div class="grade">
        <button class="turma" data-modo="aluno"><strong>Sou aluno</strong><span>Nome, sala e senha da sala</span></button>
        <button class="turma" data-modo="professor"><strong>Sou professor</strong><span>Entrar com senha</span></button>
        <button class="turma" data-modo="diretor"><strong>Sou da direção</strong><span>Entrar com senha</span></button>
      </div>`;
  }
  document.getElementById("sub").textContent = ESCOLAS[ler("escola")] || "";
  app.innerHTML = `
    ${modoPerfil ? '<button class="voltar" id="pVoltar">' + VOLTAR_ICONE + ' Voltar</button>' : ""}
    <h2>Quem é você?</h2>${corpo}`;

  app.querySelectorAll("[data-modo]").forEach(b => b.addEventListener("click", () => { modoPerfil = b.dataset.modo; erroPerfil = ""; desenhar(); }));
  const voltar = document.getElementById("pVoltar");
  if(voltar) voltar.addEventListener("click", () => { modoPerfil = null; erroPerfil = ""; desenhar(); });
  const entrar = document.getElementById("pEntrar");
  if(!entrar) return;
  entrar.addEventListener("click", async () => {
    const nome = document.getElementById("pNome").value.trim();
    if(!nome){ erroPerfil = "Digite seu nome."; desenhar(); return; }
    const falha = e => { erroPerfil = /tentativas/i.test(e.message) ? e.message : "Não consegui conectar. Verifique a internet e tente de novo."; desenhar(); };
    if(modoPerfil === "aluno"){
      const sala = document.getElementById("pSala").value;
      const senhaSala = document.getElementById("pSalaSenha").value.trim();
      if(!senhaSala){ erroPerfil = "Digite a senha da sua sala."; desenhar(); return; }
      let ok = false;
      try { ok = await chamar("checar_sala", { p_sala: sala, p_senha: senhaSala }); } catch(e){ falha(e); return; }
      if(ok !== true){ erroPerfil = "Senha da sala incorreta."; desenhar(); return; }
      guardar("perfil", JSON.stringify({ tipo:"aluno", nome, sala }));
      guardar("turma", sala);
      guardar("salaSenha:" + sala, senhaSala);
    } else if(modoPerfil === "professor"){
      const senha = document.getElementById("pSenha").value;
      let ok = false;
      try { ok = await chamar("checar_entrada", { p_senha: senha }); } catch(e){ falha(e); return; }
      if(ok !== true){ erroPerfil = "Senha incorreta."; desenhar(); return; }
      guardar("perfil", JSON.stringify({ tipo:"professor", nome }));
      guardar("profSenha", senha); apagar("dirSenha");
    } else {
      const senha = document.getElementById("pSenha").value;
      let ok = false;
      try { ok = await chamar("checar_diretor", { p_senha: senha }); } catch(e){ falha(e); return; }
      if(ok !== true){ erroPerfil = "Senha incorreta."; desenhar(); return; }
      guardar("perfil", JSON.stringify({ tipo:"diretor", nome }));
      guardar("dirSenha", senha); apagar("profSenha");
    }
    modoPerfil = null; erroPerfil = "";
    location.hash = ""; desenhar();
  });
}

      <label class="rot" for="aSala">Para quem</label>
      <select class="campo" id="aSala">${salasOpts}</select>

        <textarea class="campo" id="aTexto" rows="4" maxlength="500"></textarea></div>
      <div id="fData" hidden><label class="rot" for="aData">Dia</label>
        <input class="campo" id="aData" type="date" value="${hojeISO}"></div>
      <div id="fHora" hidden><label class="rot" for="aHora">Horário (opcional)</label>
        <input class="campo" id="aHora" type="time"></div>
      <div id="fHorario" hidden><label class="rot" for="aPeriodo">Horário sem aula</label>
        <select class="campo" id="aPeriodo">${horarios}</select></div>
      <div id="fDias"><label class="rot" for="aDias">O aviso some sozinho depois de</label>
        <select class="campo" id="aDias">
          <option value="1">1 dia</option><option value="3">3 dias</option>

        </select></div>

      <select class="campo" id="aQuando"><option value="agora">Agora</option><option value="agendar">Agendar para um dia e uma hora</option></select>
      <div id="fQuando" hidden><label class="rot" for="aQuandoDt">Dia e hora (horário de Brasília)</label>
        <input class="campo" id="aQuandoDt" type="datetime-local"></div>
      ${campoLogin}
      ${campoSenha}

      <button class="botao" id="aPostar">Publicar</button>

    <section class="cfg"><h3>Publicados e agendados</h3>
      ${diretor ? "" : '<p class="dica">Para apagar, digite a senha de avisos no campo acima e toque em Apagar.</p>'}
      <div id="lista"><p class="dica">Carregando…</p></div>
    </section>`;
  $("voltar").addEventListener("click", () => { location.hash = ""; });
  ligarAcc(app);

  /* ----- credenciais ----- */
  const loginPart = () => diretor
    ? { p_entrada: "", p_diretor: $("aDir").value || ler("dirSenha") || "" }
    : { p_entrada: $("aEntrada").value || ler("profSenha") || "", p_diretor: "" };
  const credFull = () => Object.assign(loginPart(), { p_aviso: diretor ? "" : $("aSenha").value });
  const msg = (texto, erro) => {
    const m = $("aMsg"); m.textContent = texto; m.className = erro ? "erro" : "dica"; m.hidden = false;
    m.scrollIntoView({ block: "center" });
  };
  const textoErro = (err, acao) => {
    if(/senha/i.test(err.message)){
      $("fEntrada").hidden = false;
      return diretor ? "Senha da direção incorreta ou trocada. Digite a nova no campo que apareceu."
                     : "Senha incorreta ou vencida. Se a senha de entrada mudou, digite a nova no campo que apareceu e tente de novo.";
    }
    return "Não consegui " + acao + " (" + err.message + "). Verifique a internet e tente de novo.";
  };

  /* ----- formulário muda conforme o tipo ----- */
  function ajustar(){
    const tipo = $("pTipo").value;
    $("fData").hidden = tipo === "aviso";
    $("fHora").hidden = !(tipo === "prova" || tipo === "trabalho");
    $("fHorario").hidden = tipo !== "vaga";
    $("fDias").hidden = tipo !== "aviso";
    $("fTitulo").hidden = tipo === "vaga";
    $("fQuando").hidden = $("aQuando").value !== "agendar";
    const optTodas = $("aSala").querySelector('option[value="Todas"]');
    if(optTodas){ optTodas.disabled = tipo !== "aviso"; if(tipo !== "aviso" && $("aSala").value === "Todas") $("aSala").selectedIndex = 1; }
    $("rTitulo").textContent = tipo === "aviso" ? "Título" : "Matéria e assunto";
    $("rTexto").textContent = tipo === "aviso" ? "Aviso" : (tipo === "vaga" ? "Motivo ou recado (opcional)" : "Detalhes (opcional)");
    $("aTitulo").placeholder = tipo === "aviso" ? "" : "Ex.: Matemática, funções";
    const agendado = $("aQuando").value === "agendar";
    const verbo = { aviso: "aviso", prova: "prova", trabalho: "trabalho", vaga: "aula vaga" }[tipo];
    $("aPostar").textContent = agendado ? "Agendar " + verbo : (tipo === "aviso" ? "Publicar aviso" : (tipo === "prova" ? "Marcar prova" : (tipo === "trabalho" ? "Marcar trabalho" : "Avisar aula vaga")));
  }
  $("pTipo").addEventListener("change", ajustar);
  $("aQuando").addEventListener("change", ajustar);
  ajustar();

  /* ----- lista de publicados e agendados ----- */
  const NOMES = { aviso: "Aviso", prova: "Prova", trabalho: "Trabalho", vaga: "Aula vaga" };
  const hm = iso => { const d = new Date(iso); return `${dm(iso)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  async function listar(){
    const el = $("lista");
    try {
      const l = await chamar("listar_avisos_prof", loginPart());
      const novoLogin = diretor ? $("aDir").value : $("aEntrada").value;
      if(novoLogin){ guardar(diretor ? "dirSenha" : "profSenha", novoLogin); (diretor ? $("aDir") : $("aEntrada")).value = ""; $("fEntrada").hidden = true; }
      el.innerHTML = l.length ? l.map(a => {

        return `<div class="aviso"><strong>${esc(a.titulo)}</strong>
          <small>${NOMES[a.tipo] || "Aviso"} · ${esc(escopo)} · ${a.professor === "Direção" ? "Direção" : "Prof. " + esc(a.professor)}${a.data ? " · dia " + dm(a.data + "T12:00:00") : ""}${a.hora ? " às " + esc(a.hora) : ""}${agendado ? " · agendado para " + hm(a.publicar_em) : " · some em " + dm(a.expira_em)}</small><br>

          msg("Apagado.", false); listar();
        } catch(err){ msg(textoErro(err, "apagar"), true); b.disabled = false; }
      }));
    } catch(err){
      el.innerHTML = '<p class="erro">Não consegui carregar a lista (' + esc(err.message) + ').</p>';
      if(/senha/i.test(err.message)) $("fEntrada").hidden = false;
    }
  }
  listar();
  (diretor ? $("aDir") : $("aEntrada")).addEventListener("change", listar);

  /* ----- publicar ----- */
  $("aPostar").addEventListener("click", async e => {
    const tipo = $("pTipo").value;
    const sala = $("aSala").value;
    let titulo = $("aTitulo").value.trim();
    const texto = $("aTexto").value.trim();
    const data = $("aData").value;
    const periodo = Number($("aPeriodo").value);
    if(tipo === "vaga") titulo = "Sem aula no " + periodo + "º horário";
    if(!titulo){ msg("Preencha o título.", true); return; }
    if(tipo === "aviso" && !texto){ msg("Escreva o aviso.", true); return; }
    if(tipo !== "aviso" && !data){ msg("Escolha o dia.", true); return; }
    if(tipo !== "aviso" && sala === "Todas"){ msg("Provas, trabalhos e aulas vagas precisam de uma sala. Escolha uma sala.", true); return; }
    if(!diretor && !$("aSenha").value){ msg("Digite a senha de avisos.", true); return; }
    let publicarEm = null;
    if($("aQuando").value === "agendar"){
      const v = $("aQuandoDt").value;
      const d = v ? new Date(v + ":00-03:00") : null;
      if(!d || isNaN(d)){ msg("Escolha o dia e a hora do agendamento.", true); return; }
      if(d.getTime() < Date.now() + 60000){ msg("Escolha um horário no futuro.", true); return; }
      publicarEm = d.toISOString();
    }
    const botao = e.currentTarget; botao.disabled = true;
    try {
      const res = await postarAviso(Object.assign(credFull(), {
        p_sala: sala, p_professor: diretor ? "Direção" : p.nome, p_tipo: tipo,
        p_titulo: titulo, p_texto: texto, p_dias: Number($("aDias").value),
        p_data: tipo === "aviso" ? null : data,
        p_hora: (tipo === "prova" || tipo === "trabalho") ? ($("aHora").value || null) : null,
        p_periodo: tipo === "vaga" ? periodo : null,
        p_publicar_em: publicarEm
      }));
      if(!diretor && $("aEntrada").value){ guardar("profSenha", $("aEntrada").value); $("fEntrada").hidden = true; $("aEntrada").value = ""; }
      if(diretor && $("aDir").value){ guardar("dirSenha", $("aDir").value); $("fEntrada").hidden = true; $("aDir").value = ""; }
      $("aTitulo").value = ""; $("aTexto").value = "";
      msg(res && res.agendado ? "Agendado para " + hm(publicarEm) + "." : ((tipo === "aviso" ? "Aviso publicado!" : "Publicado!") + (res && res.enviados ? " Notificação enviada para " + res.enviados + " aparelho(s)." : "")), false);
      listar();
    } catch(err){ msg(textoErro(err, "publicar"), true); }
    botao.disabled = false;
  });

  /* ----- cardápio: 3 refeições por dia ----- */
  const cardapioEd = {};
  DIAS.forEach(([k]) => { cardapioEd[k] = {}; REFEICOES.forEach(r => { cardapioEd[k][r.chave] = ""; }); });
  let diaEd = "seg";
  function desenharCampos(){
    $("cCampos").innerHTML = REFEICOES.map(r => `<label class="rot" for="c-${r.chave}">${esc(r.nome)} (${r.hora})</label>
      <input class="campo" id="c-${r.chave}" type="text" maxlength="120" value="${esc(cardapioEd[diaEd][r.chave] || "")}">`).join("");
    REFEICOES.forEach(r => $("c-" + r.chave).addEventListener("input", ev => { cardapioEd[diaEd][r.chave] = ev.target.value; }));
    app.querySelectorAll("#cDias button").forEach(b => b.setAttribute("aria-pressed", b.dataset.d === diaEd));
  }
  app.querySelectorAll("#cDias button").forEach(b => b.addEventListener("click", () => { diaEd = b.dataset.d; desenharCampos(); }));
  desenharCampos();
  buscarCardapio().then(l => {
    const c = l && l[0];
    if(c && c.semana === segundaDaSemana() && c.dados){
      DIAS.forEach(([k]) => REFEICOES.forEach(r => { cardapioEd[k][r.chave] = (c.dados[k] && c.dados[k][r.chave]) || ""; }));
      desenharCampos();
    }
  }).catch(() => {});
  $("cSalvar").addEventListener("click", async e => {
    if(!diretor && !$("aSenha").value){ msg("Digite a senha de avisos (no campo lá em cima) para salvar o cardápio.", true); window.scrollTo(0, 0); return; }
    const botao = e.currentTarget; botao.disabled = true;
    try {
      await chamar("salvar_cardapio2", Object.assign(credFull(), { p_semana: segundaDaSemana(), p_dados: cardapioEd }));
      delete cacheBlocos.cardapio;
      msg("Cardápio salvo!", false);
    } catch(err){ msg(textoErro(err, "salvar o cardápio"), true); }
    botao.disabled = false;
  });
}
 
function telaInicial(){
  const t = agora();
  const fixada = ler("turma");
  const p = perfilAtual();
  const hoje = NOME_DIA[t.dia] ? t.dia : null;
  const cartoes = Object.keys(TURMAS).map(nome => {
    const a = hoje ? aulaAgora(nome) : null;
    const status = a ? "Agora: " + a.materia : (hoje ? "Sem aula agora" : "Toque para ver os horários");
    const livros = hoje ? livrosDoDia(nome, hoje) : [];
    const aviso = livros.length ? `<span class="livro-aviso">${ic("book")} Hoje: leve o livro de ${esc(juntar(livros))}</span>` : "";
    return `<button class="turma ${a ? "ativa" : ""}" data-turma="${esc(nome)}" style="--c:${a && !a.intervalo ? corMateria(a.materia) : "var(--line)"}">
      <strong>${esc(nome)}${fixada === nome ? " " + ic("star", true) : ""}</strong><span>${esc(status)}</span>${aviso}</button>`;
  }).join("");
  const ola = p ? `<h2>Olá, ${esc(p.nome)}!</h2>` : "";
  const salaHero = (p && p.tipo === "aluno" && TURMAS[p.sala]) ? p.sala : (TURMAS[fixada] ? fixada : null);
  const areaProf = p && (p.tipo === "professor" || p.tipo === "diretor")
    ? `<div class="grade uma" style="margin-bottom:12px"><button class="turma" id="irProf"><strong>${p.tipo === "diretor" ? "Área da direção" : "Área do professor"}</strong><span>Toque para abrir</span></button></div>` : "";
  app.innerHTML = `${ola}${heroHtml(salaHero)}${areaProf}<div id="avisos"></div><div id="agenda"></div><div id="cardapio"></div>${datasHtml()}${pushAtivo(p) ? "" : blocoPush(p)}<p class="dica">Escolha sua sala para ver os dias e os horários.</p><div class="grade">${cartoes}</div>`;
  app.querySelectorAll("[data-turma]").forEach(b =>
    b.addEventListener("click", () => { diaEscolhido = null; location.hash = encodeURIComponent(b.dataset.turma); })
  );
  const heroBtn = app.querySelector("[data-hero]");
  if(heroBtn) heroBtn.addEventListener("click", () => { diaEscolhido = null; location.hash = encodeURIComponent(heroBtn.dataset.hero); });
  const ir = document.getElementById("irProf");
  if(ir) ir.addEventListener("click", () => { location.hash = "professor"; });
  if(p && p.tipo === "aluno" && TURMAS[p.sala]){ carregarAvisos(p.sala); carregarAgenda(p.sala); }
  carregarCardapio();
  ligarPush(p);
  verificarPush(p);
}
 
function telaTurma(nome){
  const t = agora();
  if(!diaEscolhido) diaEscolhido = diaInicial();
  const aulas = aulasDoDia(nome, diaEscolhido);
  const hoje = diaEscolhido === t.dia;
  const livros = livrosDoDia(nome, diaEscolhido);
  const fixada = ler("turma") === nome;
  const dc = dataCompleta(diaEscolhido);
  const dataDoDia = chaveData(dc.getFullYear(), dc.getMonth(), dc.getDate());
 
  const alerta = livros.length ? `<div class="alerta" role="alert">${ic("book")} Neste dia, leve o livro de ${esc(juntar(livros))}.</div>` : "";
  const lista = aulas.length ? aulas.map(a => {

      <span class="lado">${selos}</span></li>`;

function telaPe(){
  const escolhida = ler("peData");
  const hoje = hoje0();
  if(!peMes){
    const base = escolhida ? parseData(escolhida) : hoje;
    peMes = { ano: base.getFullYear(), mes: base.getMonth() };
  }
  const { ano, mes } = peMes;
  const pagamentos = new Set();
  PAGAMENTOS.forEach(p => pagamentos.add(p.data));

  /* contador */
  let contador = `<div class="contador"><span>Escolha uma data no calendário ou na lista abaixo.</span></div>`;
  if(escolhida){
    const n = diasAte(escolhida);
    if(n > 1) contador = `<div class="contador"><b>${n}</b><span>dias até ${formatar(escolhida)}</span></div>`;
    else if(n === 1) contador = `<div class="contador"><b>1</b><span>dia até ${formatar(escolhida)}. É amanhã!</span></div>`;
    else if(n === 0) contador = `<div class="contador"><b>É hoje!</b><span>Hoje o dinheiro cai.</span></div>`;
    else contador = `<div class="contador"><span>Essa data (${formatar(escolhida)}) já passou. Escolha a próxima.</span></div>`;
  }

  /* calendário */
  const primeiro = new Date(ano, mes, 1).getDay();
  const total = new Date(ano, mes + 1, 0).getDate();
  const hojeChave = chaveData(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  let celulas = ["D","S","T","Q","Q","S","S"].map(d => `<span class="sem">${d}</span>`).join("");
  for(let i = 0; i < primeiro; i++) celulas += "<span></span>";
  for(let d = 1; d <= total; d++){
    const ch = chaveData(ano, mes, d);
    const classes = [pagamentos.has(ch) ? "pag" : "", ch === hojeChave ? "hoje" : "", ch === escolhida ? "esc" : ""].join(" ");
    celulas += `<button class="${classes}" data-data="${ch}" aria-label="${d} de ${MESES[mes]}">${d}</button>`;
  }

  /* lista de datas */

      <span class="materia">${esc(p.rotulo)}</span>
      <span class="lado"><button class="fixar" data-usar="${p.data}">Contar</button></span>
    </li>`).join("") : `<div class="vazio">Nenhuma data futura cadastrada.</div>`;

  app.innerHTML = `
    <button class="voltar" id="voltar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Voltar</button>
    <h2>Pé-de-Meia</h2>
    ${contador}
    <label class="rot" for="peInput">Contar até o dia</label>
    <input class="campo" id="peInput" type="date" value="${esc(escolhida || "")}">
    ${escolhida ? '<button class="fixar" id="peLimpar" style="margin-bottom:14px">Limpar data</button>' : ""}
    <div class="mes">
      <button id="mesAnt" aria-label="Mês anterior"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <strong>${MESES[mes]} ${ano}</strong>
      <button id="mesProx" aria-label="Próximo mês"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="cal">${celulas}</div>

    <h3>Próximas datas</h3>
    <p class="dica">O dia do seu pagamento depende do seu mês de nascimento. Confira no app Pé-de-Meia ou no app Benefícios Sociais CAIXA.</p>
    <ul class="aulas">${lista}</ul>`;

  document.getElementById("voltar").addEventListener("click", () => { location.hash = ""; });
  document.getElementById("peInput").addEventListener("change", e => {
    if(e.target.value) guardar("peData", e.target.value); else apagar("peData");
    desenhar();
  });
  const limpar = document.getElementById("peLimpar");
  if(limpar) limpar.addEventListener("click", () => { apagar("peData"); desenhar(); });
  document.getElementById("mesAnt").addEventListener("click", () => { peMes = mes === 0 ? { ano: ano-1, mes: 11 } : { ano, mes: mes-1 }; desenhar(); });
  document.getElementById("mesProx").addEventListener("click", () => { peMes = mes === 11 ? { ano: ano+1, mes: 0 } : { ano, mes: mes+1 }; desenhar(); });

    const d = parseData(b.dataset.usar); peMes = { ano: d.getFullYear(), mes: d.getMonth() };

  if(animChk) animChk.addEventListener("change", () => { guardar("anim", animChk.checked ? "on" : "off"); aplicarAnim(); });
  app.querySelectorAll("[data-tema]").forEach(b => b.addEventListener("click", () => {

  document.getElementById("trocarPerfil").addEventListener("click", () => { desativarPush(); apagar("perfil"); apagar("profSenha"); apagar("dirSenha"); limparSenhasSala(); apagar("turma"); modoPerfil = null; location.hash = ""; desenhar(); });
  document.getElementById("trocar").addEventListener("click", () => { desativarPush(); apagar("escola"); apagar("turma"); apagar("perfil"); apagar("profSenha"); apagar("dirSenha"); limparSenhasSala(); location.hash = ""; desenhar(); });

let ultimaRota = null;
function desenhar(){
  const hash = decodeURIComponent(location.hash.slice(1));
  const escola = ler("escola");
  const rota = hash + "|" + (modoPerfil || "") + "|" + (hash && TURMAS[hash] ? diaEscolhido : "");
  app.dataset.anim = (rota !== ultimaRota && animOn()) ? "1" : "0";
  ultimaRota = rota;
  if(!ESCOLAS[escola]) { telaEscola(); return; }
  document.getElementById("sub").textContent = ESCOLAS[escola];
  if(!perfilAtual()) { telaPerfil(); return; }
  if(hash === "config") telaConfig();
  else if(hash === "pe") telaPe();
  else if(hash === "professor") telaProfessor();
  else if(hash && TURMAS[hash]) telaTurma(hash);
  else telaInicial();
}

document.getElementById("abrirPe").addEventListener("click", () => {

});

setInterval(() => {
  const h = decodeURIComponent(location.hash.slice(1));
  if(perfilAtual() && ESCOLAS[ler("escola")] && (!h || TURMAS[h])) desenhar();
}, 60000);
const fixadaAoAbrir = ler("turma");
if(!location.hash && ESCOLAS[ler("escola")] && perfilAtual() && fixadaAoAbrir && TURMAS[fixadaAoAbrir]) location.hash = encodeURIComponent(fixadaAoAbrir);
desenhar();

(function(){

  if(!sp) return;
  const nome = document.getElementById("spNome");
  if(nome && typeof ESCOLAS !== "undefined"){ nome.textContent = ESCOLAS[ler("escola")] || ESCOLAS.ceti || nome.textContent; }
  const t0 = performance.now();
  const minimo = document.documentElement.dataset.mov === "off" ? 500 : 1900;
  const fechar = () => { sp.classList.add("sai"); setTimeout(() => sp.remove(), 700); };
  const pronto = () => setTimeout(fechar, Math.max(0, minimo - (performance.now() - t0)));
  if(document.readyState === "complete") pronto(); else addEventListener("load", pronto);
})();

<script>
(function(){
  if(window.__notasMod) return;

  var CHAVE = "notas:v1";
  var CHEV = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>';
  var ICONE = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>';
  var COR = { ok:"#15803d", andamento:"#4338ca", atencao:"#a16207", final:"#a16207", risco:"#b91c1c", vazio:"#94a3b8" };

  function padrao(){ return { regra:"24", n:4, passa:24, final:14, materias:[] }; }
  function carregar(){
    try { var d = JSON.parse(localStorage.getItem(CHAVE)); if(d && Array.isArray(d.materias)) return d; } catch(e) {}
    return padrao();
  }
  var est = carregar();
  function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify(est)); } catch(e) {} }

  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var fmt = function(n){ return (Math.round(n * 10) / 10).toString().replace(".", ","); };
  var norm = function(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); };

  /* ---------- regras ---------- */
  function cfg(){
    if(est.regra === "24") return { n:4, passa:24, final:14 };
    if(est.regra === "48") return { n:8, passa:48, final:28 };
    var n = Math.max(1, Math.min(12, Number(est.n) || 4));
    var passa = Math.max(1, Number(est.passa) || 24);
    var fin = Math.max(0, Math.min(passa, Number(est.final) || 0));
    return { n:n, passa:passa, final:fin };
  }

  /* ---------- a conta de cada matéria ---------- */
  function analisar(m, c){
    var feitas = [];
    for(var i = 0; i < c.n; i++){
      var v = m.notas[i];
      if(v !== undefined && v !== null && String(v).trim() !== "" && !isNaN(Number(String(v).replace(",", ".")))) feitas.push(Number(String(v).replace(",", ".")));
    }
    var soma = feitas.reduce(function(a, b){ return a + b; }, 0);
    var resta = c.n - feitas.length;
    var falta = Math.max(0, c.passa - soma);
    var r = { soma:soma, resta:resta, falta:falta, estado:"vazio", msg:"" };
    if(feitas.length === 0){ r.msg = "Preencha as notas que você já tem."; return r; }
    if(soma >= c.passa){ r.estado = "ok"; r.rot = "Passou"; r.msg = "Já tem pontos suficientes para passar direto."; return r; }
    if(resta === 0){
      if(soma >= c.final){ r.estado = "final"; r.rot = "Prova final"; r.msg = "Não chegou em " + c.passa + " pontos. Faz a prova final (faltam " + fmt(falta) + " ponto" + (falta === 1 ? "" : "s") + ")."; }
      else { r.estado = "risco"; r.rot = "Em risco"; r.msg = "Ficou abaixo de " + c.final + " pontos, o mínimo para fazer a prova final."; }
      return r;
    }
    var media = falta / resta;
    if(media <= 10){
      r.estado = media > 7 ? "atencao" : "andamento";
      r.rot = media > 7 ? "Atenção" : "Em dia";
      r.msg = "Faltam " + fmt(falta) + " ponto" + (falta === 1 ? "" : "s") + ". Precisa de média " + fmt(media) + " " + (resta === 1 ? "na nota" : "nas " + resta + " notas") + " que " + (resta === 1 ? "falta" : "faltam") + ".";
    } else if(soma + resta * 10 >= c.final){
      var mf = Math.max(0, (c.final - soma) / resta);
      r.estado = "final"; r.rot = "Prova final";
      r.msg = "Não dá mais para passar direto. Para ao menos fazer a prova final, precisa de média " + fmt(mf) + " " + (resta === 1 ? "na nota" : "nas " + resta + " notas") + " que " + (resta === 1 ? "falta" : "faltam") + ".";
    } else {
      r.estado = "risco"; r.rot = "Em risco";
      r.msg = "Mesmo com 10 em tudo que falta, não chega a " + c.final + " pontos, o mínimo para a prova final.";
    }
    return r;
  }

  /* ---------- leitura da foto (OCR): separa matéria e notas ---------- */
  function lerLinhas(texto, n){
    var out = [];
    String(texto).split(/\r?\n/).forEach(function(linha){
      var t = linha.replace(/[|_\[\]{}]/g, " ").replace(/\s+/g, " ").trim();
      if(t.length < 4) return;
      var idx = t.search(/\d/);
      if(idx < 3) return;
      var nome = t.slice(0, idx).replace(/[^A-Za-zÀ-ÿ \/.\-]/g, "").trim();
      if(nome.replace(/[^A-Za-zÀ-ÿ]/g, "").length < 3) return;
      if(/^(total|m[eé]dia|frequ|faltas|situa|bimestre|disciplina|componente)/i.test(nome)) return;
      var achados = t.slice(idx).match(/\b\d{1,2}(?:[.,]\d{1,2})?\b/g) || [];
      var notas = achados.map(function(x){ return x.replace(",", "."); }).filter(function(x){ return Number(x) <= 10; }).slice(0, n);
      if(notas.length === 0) return;
      out.push({ nome: nome.replace(/\s+/g, " "), notas: notas });
    });
    return out;
  }

  /* ---------- telas ---------- */
  var primeira = true;
  var ultimo = "";
  var ocrLista = null, ocrMsg = "", ocrErro = "";

  function app(){ return document.getElementById("app"); }

  function render(){
    var raiz = app(); if(!raiz) return;
    var c = cfg();
    raiz.dataset.anim = primeira ? "1" : "0";
    primeira = false;
    var salaOK = materiasDaSala().length > 0;
    raiz.innerHTML =
      '<button class="nt-voltar" id="ntVoltar">' + CHEV + ' Início</button>' +
      '<h2 class="nt-titulo">Contador de notas</h2>' +
      '<div class="nt">' +
        '<section class="nt-card" id="ntResumo"></section>' +
        '<section class="nt-card"><h3>Regra de aprovação</h3>' +
          '<label for="ntRegra">Quantos pontos para passar?</label>' +
          '<select id="ntRegra">' +
            '<option value="24"' + (est.regra === "24" ? " selected" : "") + '>24 pontos (1 nota por bimestre, 4 notas)</option>' +
            '<option value="48"' + (est.regra === "48" ? " selected" : "") + '>48 pontos (2 notas por bimestre, 8 notas)</option>' +
            '<option value="outra"' + (est.regra === "outra" ? " selected" : "") + '>Outra regra</option>' +
          '</select>' +
          '<div id="ntOutra"' + (est.regra === "outra" ? "" : " hidden") + '>' +
            '<label for="ntN">Quantas notas por matéria?</label><input id="ntN" type="number" min="1" max="12" value="' + esc(est.n) + '">' +
            '<label for="ntPassa">Pontos para passar direto</label><input id="ntPassa" type="number" min="1" step="0.5" value="' + esc(est.passa) + '">' +
            '<label for="ntFinal">Pontos mínimos para fazer a prova final</label><input id="ntFinal" type="number" min="0" step="0.5" value="' + esc(est.final) + '">' +
          '</div>' +
          '<p class="nt-dica" id="ntRegraTxt"></p>' +
        '</section>' +
        '<div id="ntLista" class="nt"></div>' +
        '<section class="nt-card"><h3>Adicionar matéria</h3>' +
          '<div class="nt-linha"><input id="ntNome" type="text" maxlength="40" placeholder="Ex.: Matemática" aria-label="Nome da matéria"><button class="nt-btn" id="ntAdd">Adicionar</button></div>' +
          '<div class="nt-acoes">' +
            (salaOK ? '<button class="nt-btn sec" id="ntSala">Usar as matérias da minha sala</button>' : '') +
            '<label class="nt-btn sec" style="margin:0;display:inline-block">Ler foto do boletim<input id="ntFoto" type="file" accept="image/*" hidden></label>' +
          '</div>' +
          '<p class="nt-dica" style="margin:10px 0 0">A leitura da foto é feita aqui no seu celular, e a imagem não é enviada para ninguém. Ela pode errar, então sempre confira antes de usar.</p>' +
        '</section>' +
        '<div id="ntOcr"></div>' +
        '<p class="nt-dica">Regras baseadas nas diretrizes da SEDUC-PI: 24 pontos nos 4 bimestres passa direto, de 14 a 23 faz a prova final, abaixo de 14 reprova. Frequência abaixo de 75% reprova mesmo com nota boa. Confirme a regra da sua escola na secretaria.</p>' +
        '<button class="nt-link" id="ntLimpar">Apagar todas as notas</button>' +
      '</div>';
    ligar();
    listar();
    desenharOcr();
    atualizar();
  }

  function listar(){
    var c = cfg(), el = document.getElementById("ntLista");
    if(!el) return;
    if(est.materias.length === 0){ el.innerHTML = '<section class="nt-card"><p class="nt-dica" style="margin:0">Nenhuma matéria ainda. Adicione abaixo, use as matérias da sua sala ou leia a foto do boletim.</p></section>'; return; }
    el.innerHTML = est.materias.map(function(m, mi){
      var campos = "";
      for(var i = 0; i < c.n; i++){
        var rot = c.n === 4 ? (i + 1) + "º bim." : (c.n === 8 ? Math.floor(i / 2 + 1) + "º bim. n" + (i % 2 + 1) : "Nota " + (i + 1));
        campos += '<div><label for="nt-' + mi + '-' + i + '">' + rot + '</label><input id="nt-' + mi + '-' + i + '" data-m="' + mi + '" data-i="' + i + '" type="text" inputmode="decimal" maxlength="5" value="' + esc(m.notas[i] === undefined ? "" : m.notas[i]) + '"></div>';
      }
      return '<section class="nt-card nt-mat" id="ntM' + mi + '"><header><strong>' + esc(m.nome) + '</strong><button class="nt-del" data-del="' + mi + '">Remover</button></header>' +
        '<div class="nt-notas">' + campos + '</div><div class="nt-st" id="ntSt' + mi + '"></div></section>';
    }).join("");
    el.querySelectorAll("input[data-m]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var m = est.materias[Number(inp.dataset.m)];
        var v = inp.value.replace(/[^0-9.,]/g, "");
        if(v !== inp.value) inp.value = v;
        var num = Number(v.replace(",", "."));
        if(v !== "" && !isNaN(num) && num > 10){ inp.value = "10"; v = "10"; }
        m.notas[Number(inp.dataset.i)] = v;
        salvar(); atualizar();
      });
    });
    el.querySelectorAll("[data-del]").forEach(function(b){
      b.addEventListener("click", function(){
        var m = est.materias[Number(b.dataset.del)];
        if(!confirm("Remover " + m.nome + "?")) return;
        est.materias.splice(Number(b.dataset.del), 1); salvar(); listar(); atualizar();
      });
    });
  }

  function atualizar(){
    var c = cfg(), tot = 0, falta = 0, cont = { ok:0, andamento:0, atencao:0, final:0, risco:0 }, comNota = 0;
    est.materias.forEach(function(m, mi){
      var r = analisar(m, c);
      var st = document.getElementById("ntSt" + mi), card = document.getElementById("ntM" + mi);
      if(card) card.style.setProperty("--c", COR[r.estado]);
      if(st) st.innerHTML = (r.rot ? '<span class="pill ' + r.estado + '">' + r.rot + '</span>' : '') + esc(r.msg) +
        (r.estado !== "vazio" ? ' <span style="color:var(--mute,#5a5e85);font-weight:500">(' + fmt(r.soma) + " de " + c.passa + ' pontos)</span>' : '');
      if(r.estado !== "vazio"){ comNota++; tot += r.soma; falta += r.falta; cont[r.estado]++; }
    });
    var res = document.getElementById("ntResumo"), txt = document.getElementById("ntRegraTxt");
    if(txt){
      txt.textContent = "Passa direto com " + c.passa + " pontos por matéria (" + c.n + " notas de 0 a 10). De " + c.final + " a " + fmt(c.passa - 0.1) + " pontos, faz a prova final. Abaixo de " + c.final + ", reprova.";
    }
    if(!res) return;
    if(comNota === 0){
      res.innerHTML = '<h3>Ao todo</h3><p class="nt-dica" style="margin:0">Quando você preencher as notas, aqui aparece quanto já tirou e quanto falta para passar.</p>';
      return;
    }
    var meta = comNota * c.passa, pct = Math.max(0, Math.min(100, tot / meta * 100));
    res.innerHTML =
      '<h3>Ao todo</h3>' +
      '<div class="nt-grande">' + fmt(tot) + ' <span style="font-size:1rem;font-weight:700;color:var(--mute,#5a5e85)">pontos tirados</span></div>' +
      '<div class="nt-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pct) + '"><i style="width:' + pct.toFixed(0) + '%"></i></div>' +
      '<div style="font-weight:700">Faltam ' + fmt(falta) + ' pontos para passar direto em todas as matérias com nota.</div>' +
      '<div class="nt-chips">' +
        (cont.ok ? '<span class="nt-chip ok">' + cont.ok + ' passou</span>' : '') +
        ((cont.andamento + cont.atencao) ? '<span class="nt-chip andamento">' + (cont.andamento + cont.atencao) + ' em andamento</span>' : '') +
        (cont.final ? '<span class="nt-chip final">' + cont.final + ' prova final</span>' : '') +
        (cont.risco ? '<span class="nt-chip risco">' + cont.risco + ' em risco</span>' : '') +
      '</div>';
  }

  function materiasDaSala(){
    try {
      var p = JSON.parse(localStorage.getItem("perfil") || "null");
      if(!p || !p.sala || typeof TURMAS === "undefined" || !TURMAS[p.sala]) return [];
      var set = {}, lista = [];
      Object.keys(TURMAS[p.sala]).forEach(function(dia){
        (TURMAS[p.sala][dia] || []).forEach(function(a){
          if(a && a[0] && !set[a[0]] && !/^(curso|recomposi|percurso|atividade)/i.test(a[0])){ set[a[0]] = 1; lista.push(a[0]); }
        });
      });
      return lista;
    } catch(e) { return []; }
  }

  function adicionar(nome, notas){
    nome = String(nome || "").trim().replace(/\s+/g, " ");
    if(!nome) return false;
    var existe = est.materias.find(function(m){ return norm(m.nome) === norm(nome); });
    if(existe){ if(notas) notas.forEach(function(v, i){ existe.notas[i] = v; }); return true; }
    est.materias.push({ nome: nome.slice(0, 40), notas: notas ? notas.slice() : [] });
    return true;
  }

  function desenharOcr(){
    var el = document.getElementById("ntOcr"); if(!el) return;
    if(ocrErro){ el.innerHTML = '<section class="nt-card"><p class="nt-erro">' + esc(ocrErro) + '</p></section>'; return; }
    if(ocrMsg){ el.innerHTML = '<section class="nt-card"><p class="nt-dica" style="margin:0">' + esc(ocrMsg) + '</p></section>'; return; }
    if(!ocrLista){ el.innerHTML = ""; return; }
    if(ocrLista.length === 0){ el.innerHTML = '<section class="nt-card"><p class="nt-erro">Não consegui achar matérias e notas nessa foto. Tente uma foto mais reta e com boa luz, ou digite as notas.</p></section>'; return; }
    var c = cfg();
    el.innerHTML = '<section class="nt-card"><h3>Conferir o que li</h3><p class="nt-dica">Corrija o que estiver errado. Só entram as linhas marcadas. Notas lidas a mais que o limite de ' + c.n + ' foram cortadas.</p><div class="nt-ocr">' +
      ocrLista.map(function(l, i){
        return '<div class="lin"><input type="checkbox" data-o="' + i + '" checked aria-label="Usar esta linha"><div>' +
          '<input type="text" data-on="' + i + '" value="' + esc(l.nome) + '" aria-label="Matéria">' +
          '<input type="text" data-ov="' + i + '" value="' + esc(l.notas.join("; ")) + '" aria-label="Notas separadas por ponto e vírgula"></div></div>';
      }).join("") + '</div><div class="nt-acoes"><button class="nt-btn" id="ntImportar">Usar estas notas</button><button class="nt-btn sec" id="ntCancelar">Cancelar</button></div></section>';
    document.getElementById("ntCancelar").addEventListener("click", function(){ ocrLista = null; desenharOcr(); });
    document.getElementById("ntImportar").addEventListener("click", function(){
      var n = 0;
      ocrLista.forEach(function(l, i){
        var marcado = el.querySelector('[data-o="' + i + '"]').checked;
        if(!marcado) return;
        var nome = el.querySelector('[data-on="' + i + '"]').value;
        var notas = el.querySelector('[data-ov="' + i + '"]').value.split(/[;,\s]+(?=\d)/).map(function(x){ return x.replace(",", ".").trim(); }).filter(function(x){ return x !== "" && !isNaN(Number(x)) && Number(x) <= 10; }).slice(0, c.n);
        if(adicionar(nome, notas)) n++;
      });
      ocrLista = null; salvar(); listar(); desenharOcr(); atualizar();
      if(n) { ocrMsg = n + " matéria" + (n === 1 ? "" : "s") + " adicionada" + (n === 1 ? "" : "s") + "."; desenharOcr(); setTimeout(function(){ ocrMsg = ""; desenharOcr(); }, 3000); }
    });
  }

  function carregarTesseract(){
    return new Promise(function(res, rej){
      if(window.Tesseract) return res(window.Tesseract);
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = function(){ res(window.Tesseract); };
      s.onerror = function(){ rej(new Error("Não consegui baixar o leitor de fotos. Verifique a internet e tente de novo.")); };
      document.head.appendChild(s);
    });
  }

  function ligar(){
    document.getElementById("ntVoltar").addEventListener("click", function(){ location.hash = ""; });
    var regra = document.getElementById("ntRegra");
    regra.addEventListener("change", function(){
      est.regra = regra.value; salvar();
      document.getElementById("ntOutra").hidden = est.regra !== "outra";
      listar(); atualizar();
    });
    [["ntN","n"],["ntPassa","passa"],["ntFinal","final"]].forEach(function(p){
      var i = document.getElementById(p[0]);
      i.addEventListener("input", function(){ est[p[1]] = i.value; salvar(); listar(); atualizar(); });
    });
    var nome = document.getElementById("ntNome");
    function add(){ if(adicionar(nome.value)){ nome.value = ""; salvar(); listar(); atualizar(); nome.focus(); } }
    document.getElementById("ntAdd").addEventListener("click", add);
    nome.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); add(); } });
    var sala = document.getElementById("ntSala");
    if(sala) sala.addEventListener("click", function(){ materiasDaSala().forEach(function(n){ adicionar(n); }); salvar(); listar(); atualizar(); });
    document.getElementById("ntLimpar").addEventListener("click", function(){
      if(!confirm("Apagar todas as matérias e notas deste aparelho?")) return;
      est = padrao(); salvar(); render();
    });
    document.getElementById("ntFoto").addEventListener("change", async function(e){
      var arq = e.target.files && e.target.files[0];
      e.target.value = "";
      if(!arq) return;
      ocrLista = null; ocrErro = ""; ocrMsg = "Preparando o leitor de fotos... (na primeira vez demora um pouco)"; desenharOcr();
      try {
        var T = await carregarTesseract();
        var r = await T.recognize(arq, "por", { logger: function(m){
          if(m && m.status === "recognizing text"){ ocrMsg = "Lendo a foto... " + Math.round((m.progress || 0) * 100) + "%"; desenharOcr(); }
        } });
        ocrMsg = ""; ocrLista = lerLinhas(r.data.text, cfg().n); desenharOcr();
      } catch(err){
        ocrMsg = ""; ocrErro = (err && err.message) || "Não consegui ler a foto."; desenharOcr();
      }
    });
  }

  /* ---------- botão no topo e rota #notas ---------- */
  function injetarBotao(){
    if(document.getElementById("abrirNotas")) return;
    var b = document.createElement("button");
    b.className = "engrenagem"; b.id = "abrirNotas"; b.type = "button";
    b.setAttribute("aria-label", "Contador de notas"); b.title = "Contador de notas";
    b.innerHTML = ICONE;
    b.addEventListener("click", function(){
      if(!localStorage.getItem("perfil") || !localStorage.getItem("escola")) return;
      location.hash = "notas";
    });
    var alvo = document.querySelector(".botoes");
    if(alvo) alvo.insertBefore(b, alvo.firstChild);
    else { b.style.cssText = "position:fixed;right:14px;bottom:14px;z-index:50;width:46px;height:46px;border-radius:50%"; document.body.appendChild(b); }
  }

  function checar(){
    var h = decodeURIComponent(location.hash.replace("#", ""));
    if(h === "notas" && localStorage.getItem("perfil") && localStorage.getItem("escola")){
      if(ultimo !== "notas") primeira = true;
      ultimo = "notas"; render(); window.scrollTo(0, 0);
    } else ultimo = "";
  }

  window.__notasMod = { lerLinhas: lerLinhas, analisar: analisar };
  injetarBotao();
  window.addEventListener("hashchange", checar);
  checar();
})();
</script>
