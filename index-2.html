<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14163A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Horários da escola</title>
<style>
  :root{
    --ink:#14163A;--on:#FFFFFF;--bus:#F2F3FA;--sky:#F2F3FA;--card:#FFFFFF;--bege:#E8EAF7;--line:#D9DCEF;--mute:#5A5E85;--now:#4338CA;
    --agora:#E6E4FB;--rojo:#C62828;--rojo-bg:#FFF1F0;--alerta-bg:#FDECEA;--alerta-tx:#8E1B1B;
    --titulo:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
    --texto:"DM Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  }
  :root[data-tema="escuro"]{
    --ink:#ECEBFF;--on:#0C0E24;--bus:#0C0E24;--sky:#0C0E24;--card:#161A3A;--bege:#1D2147;--line:#2B3066;--mute:#A3A8D6;--now:#9A93FF;
    --agora:#222759;--rojo:#EF5350;--rojo-bg:#2A1A24;--alerta-bg:#2E1A26;--alerta-tx:#FFB4C0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--texto);line-height:1.4}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--now);outline-offset:2px}
  h1,h2,h3,.hero-materia,.turma strong,.contador b,.aula time,.dias b{font-family:var(--titulo)}

  header{padding:20px 18px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
  header h1{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
  header p{margin:4px 0 0;font-weight:500;font-size:.9rem;color:var(--mute)}
  .botoes{display:flex;gap:8px;flex:none}
  .engrenagem{background:var(--card);border:1px solid var(--line);border-radius:14px;width:44px;height:44px;font-size:1.25rem;line-height:1;flex:none}

  main{max-width:640px;margin:0 auto;padding:12px 18px 48px}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grade.uma{grid-template-columns:1fr}

  .turma{position:relative;overflow:hidden;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 20px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
  .turma::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--line))}
  .turma strong{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
  .turma span{font-size:.88rem;color:var(--mute)}
  .turma.ativa{border-color:var(--c)}
  .turma.ativa span{color:var(--ink);font-weight:700}
  .turma:disabled{opacity:.6;cursor:not-allowed;border-style:dashed}
  .beta{align-self:flex-start;background:var(--rojo);color:#fff!important;font-weight:800;padding:3px 9px;border-radius:99px}
  .turma span.livro-aviso{color:var(--rojo);font-weight:800}

  .hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;border-radius:28px;padding:22px 22px 20px;background:var(--c,var(--ink));color:#fff;margin-bottom:16px}
  .hero::after{content:attr(data-letra);position:absolute;right:10px;top:-18px;font:800 9rem/1 var(--titulo);opacity:.13;pointer-events:none}
  .hero-rot{font-weight:700;font-size:.95rem;opacity:.92}
  .hero-materia{font-size:clamp(1.9rem,9vw,2.6rem);font-weight:800;line-height:1.02;letter-spacing:-.03em;max-width:88%}
  .hero-linha{font-weight:500;opacity:.95}
  .barra{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.3);margin:10px 0 2px;overflow:hidden}
  .barra i{display:block;height:100%;background:#fff;border-radius:99px}
  .hero-resto{font-weight:700;font-size:.95rem}

  .voltar{background:none;border:0;padding:6px 0;margin-bottom:8px;font-weight:700;text-decoration:underline}
  h2{margin:0 0 14px;font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  h3{margin:0 0 6px;font-size:1.1rem;font-weight:800;letter-spacing:-.01em}

  .dias{display:flex;gap:8px;margin-bottom:16px}
  .dias button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0 9px;background:var(--card);border:1px solid var(--line);border-radius:16px;font-weight:700;font-size:.85rem}
  .dias b{font-size:1.3rem;font-weight:800;line-height:1.1}
  .dias button[aria-pressed="true"]{background:var(--ink);color:var(--on);border-color:var(--ink)}
  .ponto{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--rojo)}

  .aulas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .aula{position:relative;overflow:hidden;display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 20px}
  .aula::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--now))}
  .aula time{font-weight:800;font-size:1.05rem;line-height:1.15}
  .aula time small{display:block;font-family:var(--texto);font-weight:500;color:var(--mute);font-size:.78rem}
  .aula .materia{font-size:1.05rem;font-weight:700;line-height:1.25}
  .aula .prof{display:block;font-size:.85rem;font-weight:500;color:var(--mute)}
  .aula.intervalo,.aula.livre{background:transparent;border-style:dashed;padding-top:8px;padding-bottom:8px}
  .aula.intervalo::before,.aula.livre::before{display:none}
  .aula.intervalo .materia,.aula.livre .materia{color:var(--mute);font-weight:500;font-size:.95rem}
  .aula.agora{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
  .aula.livro{background:var(--rojo-bg)}
  .lado{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .selo{background:var(--now);color:var(--on);font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .selo.vermelho{background:var(--rojo);color:#fff}
  .vazio{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--mute)}
  .alerta{background:var(--alerta-bg);border:1px solid var(--rojo);color:var(--alerta-tx);border-radius:16px;padding:12px 14px;font-weight:700;margin-bottom:14px}

  .topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .fixar{background:var(--card);border:1.5px solid var(--ink);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.85rem}
  .fixar[aria-pressed="true"]{background:var(--ink);color:var(--on)}
  .dica{margin:0 0 12px;color:var(--mute);font-size:.9rem;font-weight:500}

  .cfg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .cfg .dias{margin-bottom:0}
  .cfg .dias button{flex-direction:row;justify-content:center;font-size:.95rem;padding:10px 0}
  .opcao{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:700;border-top:1px solid var(--line)}
  .opcao input{width:22px;height:22px;accent-color:var(--now)}

  .rot{display:block;font-weight:700;margin-bottom:6px}
  .campo{display:block;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
  textarea.campo{resize:vertical}
  .botao{background:var(--ink);color:var(--on);border:0;border-radius:99px;padding:12px 22px;font-weight:800}
  .erro{color:var(--rojo);font-weight:700;margin:0 0 12px}

  .cfg.avisos-card{background:var(--ink);border-color:var(--ink);color:var(--on);border-radius:22px;padding:16px 18px}
  .cfg.avisos-card h3{color:var(--on)}
  .aviso{border-top:1px solid var(--line);padding:10px 0}
  .aviso:first-of-type{border-top:0;padding-top:4px}
  .aviso strong{display:block}
  .aviso p{margin:4px 0;white-space:pre-wrap}
  .aviso small{color:var(--mute);font-weight:500}
  .cfg.avisos-card .aviso{border-top-color:rgba(128,128,160,.35)}
  .cfg.avisos-card .aviso small{color:inherit;opacity:.72}
  #pushBtn{background:var(--ink);color:var(--on);width:100%;padding:12px;font-size:1rem;border-radius:99px;border-color:var(--ink)}

  .contador{background:var(--ink);color:var(--on);border-radius:26px;padding:22px;text-align:center;margin-bottom:12px}
  .contador b{display:block;font-size:3.6rem;line-height:1;font-weight:800;letter-spacing:-.04em}
  .contador span{font-weight:700}
  .mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mes strong{font-size:1.1rem;font-family:var(--titulo)}
  .mes button{background:var(--card);border:1px solid var(--line);border-radius:12px;width:42px;height:38px;font-weight:800}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:10px}
  .cal .sem{font-size:.8rem;color:var(--mute);font-weight:700}
  .cal button{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:700;padding:0}
  .cal .pag{border-color:var(--now);background:var(--agora)}
  .cal .hoje{outline:2px dashed var(--ink);outline-offset:1px}
  .cal .esc{background:var(--ink);color:var(--on);border-color:var(--ink)}
  .legenda{font-size:.85rem;color:var(--mute);font-weight:500;margin:0 0 14px}

  .ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
  .engrenagem{display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .engrenagem .ic{width:22px;height:22px}
  .voltar{display:inline-flex;align-items:center;gap:2px}
  .fixar{display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .mes button{display:inline-flex;align-items:center;justify-content:center;padding:0}
  .cfg .dias button{gap:8px}
  h3 .ic{margin-right:4px}
  .turma strong .ic{width:.85em;height:.85em;vertical-align:-.05em;color:#E0A100}
  .livro-aviso .ic,.alerta .ic{vertical-align:-.25em}

  .acc{padding:0;overflow:hidden}
  .acc-cab{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:14px;text-align:left}
  .acc-tit{font-family:var(--titulo);font-weight:800;font-size:1.1rem;letter-spacing:-.01em}
  .acc-resumo{margin-left:auto;color:var(--mute);font-size:.88rem;font-weight:500}
  .acc-cab .seta{width:1.3em;height:1.3em;transition:transform .3s ease}
  .acc.aberto .seta{transform:rotate(180deg)}
  .acc-corpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
  .acc.aberto .acc-corpo{grid-template-rows:1fr}
  .acc-int{overflow:hidden;min-height:0;padding:0 14px}
  .acc.aberto .acc-int{padding-bottom:14px}
  .acc-int .opcao:first-of-type{border-top:0}
  .temas{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:3px}
  .tema-op{display:flex;flex-direction:column;gap:8px;align-items:stretch;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;font-weight:700;text-align:left}
  .tema-op[aria-pressed="true"]{border-color:var(--now);box-shadow:0 0 0 2px var(--now)}
  .tema-prev{display:flex;align-items:flex-end;gap:5px;height:44px;border-radius:9px;padding:7px;border:1px solid rgba(128,128,160,.35)}
  .tema-prev i{display:block;height:100%;width:14px;border-radius:4px}
  .tema-prev i:first-child{height:70%}
  @media (prefers-reduced-motion:reduce){.acc-corpo,.acc-cab .seta{transition:none}}

  .evento{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .evento:first-of-type{border-top:0}
  .evento strong{display:block}
  .evento small{display:block;color:var(--mute);font-weight:500}
  .ev-data{flex:none;width:50px;height:54px;border-radius:12px;background:var(--bege);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--mute)}
  .ev-data b{font-family:var(--titulo);font-size:1.35rem;line-height:1;color:var(--ink)}
  .cardapio-dia{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .cardapio-dia:first-child{border-top:0}
  .cardapio-dia b{flex:none;width:36px}
  .acc-resumo{max-width:55%;text-align:right}
  .aula.vaga{border-style:dashed}
  .aula.vaga .materia{opacity:.7}
</style>
</head>

  <div>

</header>

function chaveParaBytes(b64){
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function ativarPush(sala){
  if(ehIOS && !instalado()) throw new Error("No iPhone, primeiro adicione o site à tela inicial (Compartilhar, depois Adicionar à Tela de Início) e abra o site por lá.");
  if(!pushSuportado()) throw new Error("Este navegador não suporta notificações.");
  const perm = await Notification.requestPermission();
  if(perm !== "granted") throw new Error("Você não permitiu as notificações. Libere nas configurações do navegador.");
  const reg = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveParaBytes(VAPID_PUBLIC_KEY) });
  const j = sub.toJSON();
  await chamar("salvar_inscricao", { p_sala: sala, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  guardar("pushSala", sala);
}
async function desativarPush(){
  try {
    if(pushSuportado()){
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if(sub){ const ep = sub.endpoint; await sub.unsubscribe(); await chamar("apagar_inscricao", { p_endpoint: ep }); }
    }
  } catch(e) {}
  apagar("pushSala");
}
const pushAtivo = p => !!p && p.tipo === "aluno" && ler("pushSala") === p.sala && pushSuportado() && Notification.permission === "granted";
function blocoPush(p){
  if(!p || p.tipo !== "aluno") return "";
  const ativo = pushAtivo(p);
  return `<section class="cfg"><h3>${ic("bell")} Notificações</h3>
    <p class="dica">${ativo ? "Ativadas: o celular avisa quando sair um aviso para " + esc(p.sala) + "." : "Receba no celular os avisos da sua sala, mesmo com o site fechado."}</p>
    <p id="pushMsg" class="erro" hidden></p>
    <button class="fixar" id="pushBtn">${ativo ? "Desativar notificações" : "Ativar notificações"}</button></section>`;
}
function ligarPush(p){
  const b = document.getElementById("pushBtn");
  if(!b || !p) return;
  b.addEventListener("click", async () => {
    const m = document.getElementById("pushMsg");
    m.hidden = true; b.disabled = true;
    try {
      if(pushAtivo(p)) await desativarPush(); else await ativarPush(p.sala);
      desenhar();
    } catch(e){ m.textContent = e.message || "Não consegui ativar."; m.hidden = false; b.disabled = false; }
  });
}

async function api(caminho, opcoes){
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + caminho, Object.assign({}, opcoes, {
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" }
  }));
  const texto = await r.text();
  let dados = null;
  try { dados = texto ? JSON.parse(texto) : null; } catch(e) {}
  if(!r.ok) throw new Error((dados && dados.message) || "Erro de conexão");
  return dados;
}
async function postarAviso(args){

    body: JSON.stringify(args)
  });

  try { d = await r.json(); } catch(e) {}
  if(!r.ok) throw new Error((d && d.erro) || "Erro de conexão");
  return d;
}

const cacheBlocos = {};
function carregarBloco(id, chave, buscar, montar, vazio){
  const el0 = document.getElementById(id);
  if(el0 && cacheBlocos[chave] !== undefined){ el0.innerHTML = cacheBlocos[chave]; ligarAcc(el0); }
  buscar().then(dados => {
    const html = montar(dados) || vazio || "";
    cacheBlocos[chave] = html;
    const el = document.getElementById(id);
    if(el){ el.innerHTML = html; ligarAcc(el); }
  }).catch(err => {
    if(cacheBlocos[chave] !== undefined) return;
    const el = document.getElementById(id);
    if(el && vazio !== "") el.innerHTML = '<p class="erro">Não consegui carregar (' + esc(err.message) + ').</p>';
  });
}

function agora(){
  const d = new Date();
  return { dia: CHAVE_DIA[d.getDay()], min: d.getHours()*60 + d.getMinutes() };

function diaInicial(){ const t = agora(); return NOME_DIA[t.dia] ? t.dia : "seg"; }
 
function aulasDoDia(turma, dia){
  const lista = (TURMAS[turma] || {})[dia];
  if(!lista) return [];
  let i = 0, n = 0;
  return PERIODOS.map(p => {
    if(p.intervalo) return { ini:p.ini, fim:p.fim, intervalo:true, materia:p.nome || "Intervalo", prof:"", n:0 };
    const item = lista[i++];
    n++;
    return { ini:p.ini, fim:p.fim, intervalo:false, n, materia: item ? item[0] : "Vago", prof: item ? item[1] : "", livre: !item };
  });
}
const estaAgora = (a, t) => minutos(a.ini) <= t.min && t.min < minutos(a.fim);
const aulaAgora = turma => { const t = agora(); return aulasDoDia(turma, t.dia).find(a => estaAgora(a, t)) || null; };
const livrosDoDia = (turma, dia) => [...new Set(aulasDoDia(turma, dia).filter(a => precisaLivro(a, turma)).map(a => a.materia))];

  [/banco de dados|arquitetura|intelig|rob[oó]tica|ágeis|mentoria|^curso$|financeira|empreend/i, "#0F766E"]
];
const corMateria = m => { for(const [re, c] of CORES) if(re.test(m)) return c; return "#64748B"; };
const maiuscula = t => t.charAt(0).toUpperCase() + t.slice(1);

/* número do dia de cada aba (semana atual; no fim de semana mostra a próxima) */
function dataCompleta(k){
  const d = hoje0(), dow = d.getDay();
  d.setDate(d.getDate() - ((dow + 6) % 7) + (dow === 0 || dow === 6 ? 7 : 0) + DIAS.findIndex(x => x[0] === k));
  return d;
}
function dataDia(k){ return dataCompleta(k).getDate(); }

/* cartão grande "agora" da tela inicial */
function heroHtml(sala){
  if(!sala || !TURMAS[sala]) return "";
  const t = agora();
  const util = !!NOME_DIA[t.dia];
  const aulas = util ? aulasDoDia(sala, t.dia) : [];
  const atual = util ? aulas.find(a => estaAgora(a, t)) : null;
  let cor = "var(--ink)", rot, titulo, linha, rodape, pct = null;
  if(atual){
    const prox = aulas.find(a => !a.intervalo && minutos(a.ini) >= minutos(atual.fim));
    cor = atual.intervalo ? "#334155" : corMateria(atual.materia);
    rot = "Agora, " + sala;
    titulo = atual.materia;
    linha = (atual.prof ? atual.prof + " · " : "") + atual.ini + " às " + atual.fim;
    pct = Math.max(0, Math.min(100, (t.min - minutos(atual.ini)) / (minutos(atual.fim) - minutos(atual.ini)) * 100));
    rodape = "Faltam " + (minutos(atual.fim) - t.min) + " min" + (prox ? " · Depois: " + prox.materia + " às " + prox.ini : " · É a última aula do dia");
  } else {
    const prox = aulas.find(a => !a.intervalo && minutos(a.ini) > t.min);
    if(prox){
      cor = corMateria(prox.materia);
      rot = "Próxima aula, " + sala;
      titulo = prox.materia;
      linha = (prox.prof ? prox.prof + " · " : "") + prox.ini + " às " + prox.fim;
      rodape = "Começa em " + (minutos(prox.ini) - t.min) + " min";
    } else {
      const ordem = ["seg","ter","qua","qui","sex"];
      const i = ordem.indexOf(t.dia);
      const dia = (i >= 0 && i < 4) ? ordem[i + 1] : "seg";
      const primeira = aulasDoDia(sala, dia).find(a => !a.intervalo && !a.livre) || aulasDoDia(sala, dia).find(a => !a.intervalo);
      if(!primeira) return "";
      cor = corMateria(primeira.materia);
      rot = (util ? "Acabou por hoje, " : "Bom fim de semana, ") + sala;
      titulo = primeira.materia;
      linha = maiuscula(NOME_DIA[dia]) + " às " + primeira.ini + (primeira.prof ? " · " + primeira.prof : "");
      rodape = "Primeira aula de " + NOME_DIA[dia];
    }
  }
  const tam = titulo.length > 30 ? "1.45rem" : (titulo.length > 18 ? "1.9rem" : "");
  return `<button class="hero" data-hero="${esc(sala)}" data-letra="${esc(titulo.charAt(0).toUpperCase())}" style="--c:${cor}">
    <span class="hero-rot">${esc(rot)}</span>
    <strong class="hero-materia"${tam ? ` style="font-size:${tam}"` : ""}>${esc(titulo)}</strong>
    <span class="hero-linha">${esc(linha)}</span>
    ${pct !== null ? `<span class="barra"><i style="width:${pct.toFixed(0)}%"></i></span>` : ""}
    <span class="hero-resto">${esc(rodape)}</span></button>`;
}

/* ---------- seções que abrem e fecham (configurações) ---------- */
const accAbertos = new Set(["tema"]);
const VOLTAR_ICONE = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>';
const SETA_BAIXO = '<svg class="ic seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
function acordeao(id, titulo, resumo, corpo){
  const aberto = accAbertos.has(id);
  return `<section class="cfg acc${aberto ? " aberto" : ""}" data-acc="${id}">
    <button class="acc-cab" aria-expanded="${aberto}" aria-controls="acc-${id}">
      <span class="acc-tit">${esc(titulo)}</span><span class="acc-resumo">${esc(resumo)}</span>${SETA_BAIXO}
    </button>
    <div class="acc-corpo" id="acc-${id}"><div class="acc-int">${corpo}</div></div>
  </section>`;
}
function ligarAcc(raiz){
  (raiz || app).querySelectorAll(".acc-cab").forEach(cab => cab.addEventListener("click", () => {
    const sec = cab.closest(".acc");
    const aberto = sec.classList.toggle("aberto");
    cab.setAttribute("aria-expanded", aberto);
    if(aberto) accAbertos.add(sec.dataset.acc); else accAbertos.delete(sec.dataset.acc);
  }));
}

  const ir = document.getElementById("irProf");

function telaTurma(nome){
  const t = agora();
  if(!diaEscolhido) diaEscolhido = diaInicial();
  const aulas = aulasDoDia(nome, diaEscolhido);
  const hoje = diaEscolhido === t.dia;
  const livros = livrosDoDia(nome, diaEscolhido);
  const fixada = ler("turma") === nome;
  const dc = dataCompleta(diaEscolhido);
  const dataDoDia = chaveData(dc.getFullYear(), dc.getMonth(), dc.getDate());
 
  const alerta = livros.length ? `<div class="alerta" role="alert">${ic("book")} Neste dia, leve o livro de ${esc(juntar(livros))}.</div>` : "";
  const lista = aulas.length ? aulas.map(a => {
    const agoraNessa = hoje && estaAgora(a, t);
    const livro = precisaLivro(a, nome);
    const hora = `${a.ini}<small>até ${a.fim}</small>`;
    const vaga = (!a.intervalo && !a.livre) ? (vagasPorSala[nome] || []).find(v => v.data === dataDoDia && v.periodo === a.n) : null;
    const selos = (vaga ? '<span class="selo vermelho">Sem aula</span>' : "") + (livro && !vaga ? '<span class="selo vermelho">Leve o livro</span>' : "") + (agoraNessa ? '<span class="selo">Agora</span>' : "");
    return `<li class="aula ${a.intervalo ? "intervalo" : ""} ${a.livre ? "livre" : ""} ${agoraNessa ? "agora" : ""} ${livro ? "livro" : ""} ${vaga ? "vaga" : ""}" style="--c:${a.intervalo || a.livre ? "#94A3B8" : corMateria(a.materia)}">
      <time>${hora}</time>
      <span class="materia">${esc(a.materia)}${a.prof ? `<span class="prof">${esc(a.prof)}</span>` : ""}${vaga && vaga.texto ? `<span class="prof">${esc(vaga.texto)}</span>` : ""}</span>
      <span class="lado">${selos}</span></li>`;
  }).join("") : `<div class="vazio">Nenhum horário cadastrado para este dia.</div>`;
 
  app.innerHTML = `
    <div class="topo">
      <button class="voltar" id="voltar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Salas</button>
      <button class="fixar" id="fixar" aria-pressed="${fixada}">${fixada ? ic("star", true) + " Minha sala" : ic("star") + " Fixar sala"}</button>
    </div>
    <h2>${esc(nome)}</h2>
    <div id="avisos"></div>
    <div id="agenda"></div>
    <div class="dias" role="group" aria-label="Dia da semana">${abasDia(diaEscolhido, k => livrosDoDia(nome, k).length)}</div>
    ${alerta}<ul class="aulas">${lista}</ul>`;
 
  document.getElementById("voltar").addEventListener("click", () => { location.hash = ""; });
  document.getElementById("fixar").addEventListener("click", () => {
    if(fixada) apagar("turma"); else guardar("turma", nome);
    desenhar();
  });
  app.querySelectorAll("[data-dia]").forEach(b => b.addEventListener("click", () => { diaEscolhido = b.dataset.dia; desenhar(); }));
  carregarAvisos(nome);
  carregarAgenda(nome);
  carregarVagas(nome);
}

function telaPe(){
  const escolhida = ler("peData");
  const hoje = hoje0();
  if(!peMes){
    const base = escolhida ? parseData(escolhida) : hoje;
    peMes = { ano: base.getFullYear(), mes: base.getMonth() };
  }
  const { ano, mes } = peMes;
  const pagamentos = new Set();
  PAGAMENTOS.forEach(p => pagamentos.add(p.data));

  /* contador */
  let contador = `<div class="contador"><span>Escolha uma data no calendário ou na lista abaixo.</span></div>`;
  if(escolhida){
    const n = diasAte(escolhida);
    if(n > 1) contador = `<div class="contador"><b>${n}</b><span>dias até ${formatar(escolhida)}</span></div>`;
    else if(n === 1) contador = `<div class="contador"><b>1</b><span>dia até ${formatar(escolhida)}. É amanhã!</span></div>`;
    else if(n === 0) contador = `<div class="contador"><b>É hoje!</b><span>Hoje o dinheiro cai.</span></div>`;
    else contador = `<div class="contador"><span>Essa data (${formatar(escolhida)}) já passou. Escolha a próxima.</span></div>`;
  }

  /* calendário */
  const primeiro = new Date(ano, mes, 1).getDay();
  const total = new Date(ano, mes + 1, 0).getDate();
  const hojeChave = chaveData(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  let celulas = ["D","S","T","Q","Q","S","S"].map(d => `<span class="sem">${d}</span>`).join("");
  for(let i = 0; i < primeiro; i++) celulas += "<span></span>";
  for(let d = 1; d <= total; d++){
    const ch = chaveData(ano, mes, d);
    const classes = [pagamentos.has(ch) ? "pag" : "", ch === hojeChave ? "hoje" : "", ch === escolhida ? "esc" : ""].join(" ");
    celulas += `<button class="${classes}" data-data="${ch}" aria-label="${d} de ${MESES[mes]}">${d}</button>`;
  }

  /* lista de datas */
  const proximas = PAGAMENTOS.filter(p => diasAte(p.fim || p.data) >= 0);
  const lista = proximas.length ? proximas.map(p => `
    <li class="aula">
      <time>${formatar(p.data)}${p.fim ? `<small>até ${formatar(p.fim)}</small>` : ""}</time>
      <span class="materia">${esc(p.rotulo)}</span>
      <span class="lado"><button class="fixar" data-usar="${p.data}">Contar</button></span>
    </li>`).join("") : `<div class="vazio">Nenhuma data futura cadastrada.</div>`;

  app.innerHTML = `
    <button class="voltar" id="voltar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Voltar</button>
    <h2>Pé-de-Meia</h2>
    ${contador}
    <label class="rot" for="peInput">Contar até o dia</label>
    <input class="campo" id="peInput" type="date" value="${esc(escolhida || "")}">
    ${escolhida ? '<button class="fixar" id="peLimpar" style="margin-bottom:14px">Limpar data</button>' : ""}
    <div class="mes">
      <button id="mesAnt" aria-label="Mês anterior"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <strong>${MESES[mes]} ${ano}</strong>
      <button id="mesProx" aria-label="Próximo mês"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="cal">${celulas}</div>
    <p class="legenda">Os dias marcados em roxo são datas de pagamento. Toque em um dia para contar até ele.</p>
    <h3>Próximas datas</h3>
    <p class="dica">O dia do seu pagamento depende do seu mês de nascimento. Confira no app Pé-de-Meia ou no app Benefícios Sociais CAIXA.</p>
    <ul class="aulas">${lista}</ul>`;

  document.getElementById("voltar").addEventListener("click", () => { location.hash = ""; });
  document.getElementById("peInput").addEventListener("change", e => {
    if(e.target.value) guardar("peData", e.target.value); else apagar("peData");
    desenhar();
  });
  const limpar = document.getElementById("peLimpar");
  if(limpar) limpar.addEventListener("click", () => { apagar("peData"); desenhar(); });
  document.getElementById("mesAnt").addEventListener("click", () => { peMes = mes === 0 ? { ano: ano-1, mes: 11 } : { ano, mes: mes-1 }; desenhar(); });
  document.getElementById("mesProx").addEventListener("click", () => { peMes = mes === 11 ? { ano: ano+1, mes: 0 } : { ano, mes: mes+1 }; desenhar(); });
  app.querySelectorAll("[data-data]").forEach(b => b.addEventListener("click", () => { guardar("peData", b.dataset.data); desenhar(); }));
  app.querySelectorAll("[data-usar]").forEach(b => b.addEventListener("click", () => {
    guardar("peData", b.dataset.usar);
    const d = parseData(b.dataset.usar); peMes = { ano: d.getFullYear(), mes: d.getMonth() };
    desenhar();
  }));
}
 
function telaConfig(){
  const ativos = avisosAtivos();
  const tema = temaAtual();
  const p = perfilAtual();
  const quem = p ? (p.tipo === "professor" ? `${p.nome} · professor` : `${p.nome} · ${p.sala}`) : "";
  const opcoes = Object.keys(LIVROS).map(n =>
    `<label class="opcao"><input type="checkbox" data-prof="${esc(n)}" ${ativos.includes(n) ? "checked" : ""}> ${esc(n)}</label>`
  ).join("");
  const temaOpcoes = TEMAS.map(t => `<button class="tema-op" data-tema="${t.id}" aria-pressed="${t.id === tema}">
      <span class="tema-prev" style="background:${t.cores[0]}"><i style="background:${t.cores[1]}"></i><i style="background:${t.cores[2]}"></i></span>
      <span>${esc(t.nome)}</span></button>`).join("");
  const acTema = acordeao("tema", "Tema", TEMAS.find(t => t.id === tema).nome,
    `<div class="temas">${temaOpcoes}</div><p class="dica" style="margin:12px 0 0">Mais temas em breve.</p>`);
  const acLivros = acordeao("livros", "Avisos de livro", resumoLivros(ativos.length),
    `<p class="dica">Marque as matérias em que você quer ser avisado para levar o livro.</p>${opcoes}`);
  app.innerHTML = `
    <button class="voltar" id="voltar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Voltar</button>
    <h2>Configurações</h2>
    ${acTema}
    ${acLivros}
    ${blocoPush(p)}
    ${instalarHtml()}
    <section class="cfg"><h3>Quem sou eu</h3>
      <p class="dica">${esc(quem)}</p>
      <button class="fixar" id="trocarPerfil">Trocar perfil</button>
    </section>
    <section class="cfg"><h3>Escola</h3>
      <p class="dica">${esc(ESCOLAS[ler("escola")] || "")}</p>
      <button class="fixar" id="trocar">Trocar escola</button>
    </section>`;
  document.getElementById("voltar").addEventListener("click", () => { location.hash = ""; });
  ligarPush(p);
  ligarInstalar();
  ligarAcc(app);
  app.querySelectorAll("[data-tema]").forEach(b => b.addEventListener("click", () => {
    guardar("tema", b.dataset.tema); aplicarTema();
    app.querySelectorAll("[data-tema]").forEach(x => x.setAttribute("aria-pressed", x === b));
    const resumo = app.querySelector('[data-acc="tema"] .acc-resumo');
    if(resumo) resumo.textContent = TEMAS.find(t => t.id === b.dataset.tema).nome;
  }));
  app.querySelectorAll("[data-prof]").forEach(c => c.addEventListener("change", () => {
    const lista = [...app.querySelectorAll("[data-prof]:checked")].map(x => x.dataset.prof);
    guardar("avisosLivro", JSON.stringify(lista));
    const resumo = app.querySelector('[data-acc="livros"] .acc-resumo');
    if(resumo) resumo.textContent = resumoLivros(lista.length);
  }));
  document.getElementById("trocarPerfil").addEventListener("click", () => { desativarPush(); apagar("perfil"); apagar("profSenha"); apagar("turma"); modoPerfil = null; location.hash = ""; desenhar(); });
  document.getElementById("trocar").addEventListener("click", () => { desativarPush(); apagar("escola"); apagar("turma"); apagar("perfil"); apagar("profSenha"); location.hash = ""; desenhar(); });
}
 
function desenhar(){
  const hash = decodeURIComponent(location.hash.slice(1));
  const escola = ler("escola");
  if(!ESCOLAS[escola]) { telaEscola(); return; }
  document.getElementById("sub").textContent = ESCOLAS[escola];
  if(!perfilAtual()) { telaPerfil(); return; }
  if(hash === "config") telaConfig();
  else if(hash === "pe") telaPe();
  else if(hash === "professor") telaProfessor();
  else if(hash && TURMAS[hash]) telaTurma(hash);
  else telaInicial();
}
 
document.getElementById("abrirConfig").addEventListener("click", () => {
  if(ESCOLAS[ler("escola")] && perfilAtual()) location.hash = "config";
});
document.getElementById("abrirPe").addEventListener("click", () => {
  if(ESCOLAS[ler("escola")] && perfilAtual()) location.hash = "pe";
});
window.addEventListener("hashchange", () => { desenhar(); window.scrollTo(0,0); });
setInterval(() => {
  const h = decodeURIComponent(location.hash.slice(1));
  if(perfilAtual() && ESCOLAS[ler("escola")] && (!h || TURMAS[h])) desenhar();
}, 60000);
const fixadaAoAbrir = ler("turma");
if(!location.hash && ESCOLAS[ler("escola")] && perfilAtual() && fixadaAoAbrir && TURMAS[fixadaAoAbrir]) location.hash = encodeURIComponent(fixadaAoAbrir);
desenhar();
</script>
</body>
</html>
